version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "@astrojs/*"
          - "astro"
          - "sharp"
          - "schema-dts"
          - "web-vitals"
      development-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "chore(deps)"
    # Auto-merge patch updates if CI passes.
    # Major and minor versions still need human review.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "ci(actions)"
