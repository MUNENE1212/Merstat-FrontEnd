# =============================================================================
# merstat.org — static Astro build + /api/ proxy to merstat-api
#
# Enabled via:
#   sudo ln -sf /etc/nginx/sites-available/merstat.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate:
#   sudo certbot certonly --nginx -d merstat.org -d www.merstat.org
#
# The security headers below are transcribed from netlify.toml, which was the
# only copy of this policy. They are load-bearing: dropping the CSP or HSTS
# removes XSS and framing protection without anything visibly breaking, so
# treat this block as code and keep it in step with netlify.toml.
# =============================================================================

# Cache-bust form/presign traffic without starving static assets.
limit_req_zone $binary_remote_addr zone=merstat_api:10m rate=30r/s;

# --- HTTP: ACME passthrough, then straight to HTTPS ------------------------
server {
    listen 80;
    listen [::]:80;
    server_name merstat.org www.merstat.org;

    # Must precede the redirect below or certbot's renewal request is
    # swallowed by the 301 and renewal silently fails.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://merstat.org$request_uri;
    }
}

# --- HTTPS: www -> apex ----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.merstat.org;

    ssl_certificate /etc/letsencrypt/live/merstat.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merstat.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://merstat.org$request_uri;
}

# --- HTTPS: merstat.org ----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name merstat.org;

    ssl_certificate /etc/letsencrypt/live/merstat.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merstat.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # `current` already resolves to <release>/dist — merstat-deploy points it
    # there, not at the release root. Appending another /dist would look for
    # dist/dist and 404 every page.
    root /var/www/merstat/current;
    index index.html;

    # Trailing slash canonicalisation. Every canonical and hreflang URL in the
    # build ends in a slash, so serving /services as a 200 as well would give
    # search engines two indexable URLs for one page. The lookahead keeps
    # /api/ out: API routes have no trailing slash, and redirecting them would
    # break every form submission and presign call with a 301.
    location ~ ^/(?!api/)([^.]+[^/])$ {
        return 301 $uri/;
    }

    # Astro builds to directory/index.html (build.format: 'directory').
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Netlify served dist/404.html implicitly for unmatched paths.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # --- API (form handler + R2 presign) -----------------------------------
    location /api/ {
        limit_req zone=merstat_api burst=10 nodelay;

        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Asset caching (from netlify.toml) ---------------------------------
    location /_assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Netlify added Access-Control-Allow-Origin to font MIME types by default;
    # nginx does not. SEO.astro preloads this woff2 with `crossorigin`, and
    # without the header the preload is discarded and the font downloads twice.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Sveltia CMS must never be cached at the edge.
    location /admin/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # --- Legacy URLs from the old static site (from netlify.toml) ---------
    # Keep for a year after cutover, then remove.
    location = /Bookus.html { return 301 /contact/; }
    location = /Bookus { return 301 /contact/; }
    location = /Aboutus.html { return 301 /about/; }
    location = /Aboutus { return 301 /about/; }
    location = /Results&Methods.html { return 301 /results/; }
    location = /Results&Methods { return 301 /results/; }
    location /templates/ {
        rewrite ^/templates/(.*)$ /$1 permanent;
    }

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/rss+xml image/svg+xml font/woff font/woff2;

    # --- Security headers (verbatim from netlify.toml) ---------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "0" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://plausible.io https://cloudflareinsights.com https://*.r2.cloudflarestorage.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
}